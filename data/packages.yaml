# Single source of truth for the package catalog on pkgs.rsquaredacademy.com.
# Rendered by build.mjs into index.html - never hand-edit index.html.
# Conventions: github -> rsquaredacademy/<name>, docs -> https://<name>.rsquaredacademy.com,
# hex -> images/hex-<name>.webp. Specify a field only to override the convention.
# Unreleased pipeline packages are NEVER listed here (public repo embargo).

- name: olsrr
  tagline: "Tools for building linear regression models."
  blurb: "Diagnostics, variable selection and influence measures for a fitted `lm`."
  features:
    - Comprehensive Regression Output
    - Variable Selection Procedures
    - Heteroskedasticity Tests
    - Collinearity Diagnostics
    - Model Fit Assessment
    - Measures of Influence
    - Residual Diagnostics
  track: flagship
  category: regression
  cran: true
  status: active

- name: blorr
  tagline: "Tools for building binary logistic regression models."
  blurb: "Model fit, validation and collinearity for a fitted `glm` with a binary outcome."
  features:
    - Bivariate Analysis
    - Model Fit Statistics
    - Model Validation
    - Variable Selection
    - Residual Diagnostics
    - Collinearity Diagnostics
    - Visualization
  track: flagship
  category: regression
  cran: true
  status: active

